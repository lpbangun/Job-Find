[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobrouter"
version = "0.1.0"
description = "Evidence-first, prompt-driven job discovery and ranking"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobrouter = "jobrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
